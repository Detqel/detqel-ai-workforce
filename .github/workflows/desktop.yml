name: Desktop Windows build
on:
  workflow_dispatch:
  push:
    paths: ['detqel-workforce-desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['detqel-workforce-desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: detqel-workforce-desktop
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: detqel-workforce-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: detqel-workforce-desktop/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run prepare:dev
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: detqel-workforce-windows-x64
          path: detqel-workforce-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
