<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DETQEL Kin</title>
  <script>
    if (window.__DETQEL_STARTUP_CONFIG__) {
      try {
        const theme = localStorage.getItem(window.__DETQEL_STARTUP_CONFIG__.themeStorageKey);
        document.documentElement.classList.toggle('dark', theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch (_) {}
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg-base: #070a12;
      --bg-mesh: radial-gradient(circle at 50% -10%, #152238 0%, #090e1a 50%, #05070d 100%);
      --panel-bg: rgba(13, 19, 33, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(18, 25, 42, 0.55);
      --card-border: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(24, 34, 56, 0.65);
      --card-active-bg: rgba(14, 30, 56, 0.65);
      --card-active-border: rgba(56, 189, 248, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #8da2bb;
      --text-muted: #53647b;
      --cyan-accent: #22d3ee;
      --cyan-glow: rgba(34, 211, 238, 0.25);
      --status-pending-bg: rgba(255, 255, 255, 0.03);
      --status-pending-border: rgba(255, 255, 255, 0.06);
      --status-pending-text: #64748b;
      --status-running-bg: rgba(56, 189, 248, 0.09);
      --status-running-border: rgba(56, 189, 248, 0.28);
      --status-running-text: #38bdf8;
      --status-complete-bg: rgba(52, 211, 153, 0.09);
      --status-complete-border: rgba(52, 211, 153, 0.28);
      --status-complete-text: #34d399;
      --status-error-bg: rgba(248, 113, 113, 0.09);
      --status-error-border: rgba(248, 113, 113, 0.28);
      --status-error-text: #f87171;
    }
    :root:not(.dark) {
      color-scheme: light;
      --bg-base: #f0f4f9;
      --bg-mesh: radial-gradient(circle at 50% -10%, #e2ecf9 0%, #f1f5f9 60%, #e8eef6 100%);
      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: rgba(0, 0, 0, 0.08);
      --card-bg: rgba(245, 248, 252, 0.85);
      --card-border: rgba(0, 0, 0, 0.05);
      --card-hover: rgba(238, 243, 250, 0.95);
      --card-active-bg: rgba(235, 244, 255, 0.95);
      --card-active-border: rgba(2, 132, 199, 0.35);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --cyan-accent: #0284c7;
      --cyan-glow: rgba(2, 132, 199, 0.15);
      --status-pending-bg: rgba(0, 0, 0, 0.03);
      --status-pending-border: rgba(0, 0, 0, 0.06);
      --status-pending-text: #64748b;
      --status-running-bg: rgba(2, 132, 199, 0.08);
      --status-running-border: rgba(2, 132, 199, 0.25);
      --status-running-text: #0284c7;
      --status-complete-bg: rgba(16, 185, 129, 0.08);
      --status-complete-border: rgba(16, 185, 129, 0.25);
      --status-complete-text: #059669;
      --status-error-bg: rgba(239, 68, 68, 0.08);
      --status-error-border: rgba(239, 68, 68, 0.25);
      --status-error-text: #dc2626;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-base);
      background-image: var(--bg-mesh);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Segoe UI Variable Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }
    main {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      position: relative;
    }
    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
      pointer-events: none;
    }
    header {
      padding: 16px 24px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .logo-tile {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(30, 42, 69, 0.7), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-tile img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      display: block;
    }
    .brand-meta {
      display: flex;
      flex-direction: column;
    }
    .app-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.2;
    }
    .app-subtitle {
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-top: 1px;
    }
    .tier-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.22);
      color: var(--cyan-accent);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.08);
      flex-shrink: 0;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan-accent);
      box-shadow: 0 0 8px var(--cyan-accent);
      animation: pulse-glow 2.4s ease-in-out infinite;
    }
    .services-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 2px 24px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }
    .services-wrapper::-webkit-scrollbar {
      width: 4px;
    }
    .services-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }
    .services-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
      margin: 0;
      padding: 0;
    }
    .service-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 48px;
      min-width: 0;
    }
    .service-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .service-card[data-status="running"] {
      background: var(--card-active-bg);
      border-color: var(--card-active-border);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.06);
    }
    .service-card[data-status="error"] {
      border-color: var(--status-error-border);
      background: var(--status-error-bg);
    }
    .service-icon-tile {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.2s ease;
    }
    .service-card[data-status="running"] .service-icon-tile {
      transform: scale(1.05);
    }
    .service-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .service-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .service-meta-row {
      margin-top: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .service-subtitle {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .service-port-badge {
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      background: rgba(255, 255, 255, 0.04);
      padding: 0 4px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 10.5px;
      font-weight: 500;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    /* Pending status */
    .service-card[data-status="pending"] .status-pill {
      background: var(--status-pending-bg);
      border: 1px solid var(--status-pending-border);
      color: var(--status-pending-text);
    }
    .service-card[data-status="pending"] .status-dot {
      background: #475569;
    }
    /* Running / Checking status */
    .service-card[data-status="running"] .status-pill {
      background: var(--status-running-bg);
      border: 1px solid var(--status-running-border);
      color: var(--status-running-text);
    }
    .service-card[data-status="running"] .status-dot {
      background: #38bdf8;
      box-shadow: 0 0 6px #38bdf8;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    /* Complete / Ready status */
    .service-card[data-status="complete"] .status-pill {
      background: var(--status-complete-bg);
      border: 1px solid var(--status-complete-border);
      color: var(--status-complete-text);
    }
    .service-card[data-status="complete"] .status-dot {
      background: #34d399;
      box-shadow: 0 0 6px #34d399;
    }
    /* Error / Failed status */
    .service-card[data-status="error"] .status-pill {
      background: var(--status-error-bg);
      border: 1px solid var(--status-error-border);
      color: var(--status-error-text);
    }
    .service-card[data-status="error"] .status-dot {
      background: #f87171;
      box-shadow: 0 0 6px #f87171;
    }
    /* Stopping status */
    .service-card[data-status="stopping"] .status-pill {
      background: rgba(245, 158, 11, 0.09);
      border: 1px solid rgba(245, 158, 11, 0.28);
      color: #f59e0b;
    }
    .service-card[data-status="stopping"] .status-dot {
      background: #f59e0b;
      box-shadow: 0 0 6px #f59e0b;
      animation: pulse-dot 1.2s ease-in-out infinite;
    }
    /* Stopped status */
    .service-card[data-status="stopped"] .status-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .service-card[data-status="stopped"] .status-dot {
      background: #64748b;
    }
    .tier-badge.stopping {
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.25);
      color: #f59e0b;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.1);
    }
    .tier-badge.stopping .badge-dot {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .progress-fill.shutdown {
      background: linear-gradient(90deg, #f59e0b 0%, #f43f5e 100%) !important;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6) !important;
    }
    .error-panel {
      margin-top: 6px;
      padding: 10px 14px;
      border: 1px solid var(--status-error-border);
      border-radius: 10px;
      background: var(--status-error-bg);
      color: var(--status-error-text);
      font-size: 11px;
      line-height: 1.4;
    }
    .error-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .error-panel p {
      margin: 0;
    }
    .error-panel code {
      display: block;
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: 10px;
      font-family: ui-monospace, monospace;
      user-select: all;
    }
    footer {
      padding: 10px 24px 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid var(--panel-border);
      background: rgba(10, 15, 27, 0.45);
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
    }
    .status-summary {
      color: var(--text-secondary);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82%;
    }
    .percent-label {
      color: var(--text-primary);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .progress-track {
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 2px 0 3px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 9999px;
      background: linear-gradient(90deg, #06b6d4 0%, #38bdf8 45%, #6366f1 80%, #a855f7 100%);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }
    .host-tag {
      letter-spacing: 0.01em;
    }
    .env-time {
      font-variant-numeric: tabular-nums;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 6px #38bdf8; }
      50% { opacity: 0.4; transform: scale(0.75); box-shadow: 0 0 2px #38bdf8; }
    }
    @media(prefers-reduced-motion:reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="app-name">
      <header>
        <div class="brand-group">
          <div class="logo-tile">
            <img id="logo" alt="DETQEL Kin">
          </div>
          <div class="brand-meta">
            <h1 id="app-name" class="app-title">DETQEL Kin</h1>
            <p class="app-subtitle">AI Workforce Platform</p>
          </div>
        </div>
        <div class="tier-badge">
          <span class="badge-dot"></span>
          <span>Enterprise Core</span>
        </div>
      </header>

      <div class="services-wrapper">
        <ol id="services" class="services-list" aria-label="Platform services"></ol>
        <div id="error" class="error-panel" role="alert" hidden>
          <div class="error-title-row">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Startup Interrupted</span>
          </div>
          <p id="message"></p>
          <code id="configuration"></code>
          <code id="logs"></code>
        </div>
      </div>

      <footer>
        <div class="progress-row">
          <span id="active" class="status-summary" role="status" aria-live="polite">Initializing platform services...</span>
          <span id="percent" class="percent-label">0%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" id="track">
          <div id="progress" class="progress-fill"></div>
        </div>
        <div class="footer-meta">
          <span class="host-tag">DETQEL Native Platform Host</span>
          <span class="env-time">Local AI Environment &bull; <span id="elapsed">0:00</span></span>
        </div>
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const config = window.__DETQEL_STARTUP_CONFIG__;
      const elements = Object.fromEntries(
        ['logo', 'elapsed', 'active', 'percent', 'track', 'progress', 'services', 'error', 'message', 'configuration', 'logs', 'app-name']
          .map(id => [id, document.getElementById(id)])
      );

      const SERVICE_REGISTRY = {

        },
        'backend-startup': {
          title: 'Platform Orchestrator',
          subtitle: 'Core Runtime Daemon',
          port: '',
          iconBg: 'rgba(56, 189, 248, 0.08)',
          icon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
        },
        'backend-api': {
          title: 'Workspace API Service',
          subtitle: 'Agent Automation Engine',
          port: ':8100',
          iconBg: 'rgba(96, 165, 250, 0.08)',
          icon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="3" rx="2"/><rect width="20" height="8" x="2" y="13" rx="2"/><line x1="6" x2="6.01" y1="7" y2="7"/><line x1="6" x2="6.01" y1="17" y2="17"/></svg>'
        },
        'frontend-startup': {
          title: 'Frontend Workspace',
          subtitle: 'Next.js Desktop UI Interface',
          port: ':3100',
          iconBg: 'rgba(251, 191, 36, 0.08)',
          icon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="3"/><line x1="2" x2="22" y1="9" y2="9"/><line x1="6" x2="6.01" y1="6.5" y2="6.5"/><line x1="9" x2="9.01" y1="6.5" y2="6.5"/><line x1="12" x2="12.01" y1="6.5" y2="6.5"/></svg>'
        }
      };

      const STATUS_LABELS = {
        pending: 'Pending',
        running: 'Checking',
        complete: 'Ready',
        error: 'Failed'
      };

      let stopped = false;
      let painted = false;
      let launchRequested = false;

      requestAnimationFrame(() => requestAnimationFrame(() => { painted = true; }));

      function showError(message, path) {
        elements['app-name'].textContent = 'Startup Alert';
        elements.active.textContent = 'Startup interrupted';
        elements.error.hidden = false;
        elements.message.textContent = message;
        elements.configuration.textContent = path || '';
      }

      if (!config || typeof config.applicationName !== 'string' || typeof config.themeStorageKey !== 'string'
          || typeof config.logoLight !== 'string' || typeof config.logoDark !== 'string'
          || typeof config.statusCommand !== 'string' || typeof config.readyCommand !== 'string'
          || !Number.isFinite(config.pollIntervalMs) || config.pollIntervalMs <= 0) {
        showError('The desktop loader configuration is unavailable. Reinstall the application.');
        return;
      }

      document.title = config.applicationName;
      elements.logo.alt = config.applicationName;
      elements.logo.src = document.documentElement.classList.contains('dark') ? config.logoDark : config.logoLight;

      window.addEventListener('pagehide', () => { stopped = true; });

      async function poll() {
        try {
          const status = await window.__TAURI__.core.invoke(config.statusCommand);
          if (stopped) return;

          if (painted && !launchRequested) {
            await window.__TAURI__.core.invoke(config.readyCommand);
            launchRequested = true;
          }

          elements.logs.textContent = status.logsDirectory ? `Logs: ${status.logsDirectory}` : '';
          const seconds = status.elapsedSeconds || 0;
          elements.elapsed.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;

          const complete = status.steps.filter(step => step.status === 'complete').length;
          const progress = status.steps.length ? Math.round(complete / status.steps.length * 100) : 0;
          elements.progress.style.width = `${progress}%`;
          elements.track.setAttribute('aria-valuenow', String(progress));
          elements.percent.textContent = `${progress}%`;

          // Dynamic bottom status message
          const runningStep = status.steps.find(step => step.status === 'running');
          if (status.ready) {
            elements.active.textContent = 'Launching workspace...';
          } else if (runningStep) {
            elements.active.textContent = runningStep.detail || `Starting ${runningStep.label}...`;
          } else {
            elements.active.textContent = complete === status.steps.length ? 'Workspace ready' : 'Initializing platform services...';
          }

          // Render services cards in 2-column grid
          elements.services.replaceChildren(...status.steps.map(step => {
            const item = document.createElement('li');
            item.className = 'service-card';
            item.dataset.status = step.status;

            const meta = SERVICE_REGISTRY[step.id] || {
              title: step.label,
              subtitle: step.detail || 'Platform Service',
              port: '',
              iconBg: 'rgba(255, 255, 255, 0.05)',
              icon: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect width="18" height="18" x="3" y="3" rx="3"/></svg>'
            };

            // Icon tile
            const iconTile = document.createElement('div');
            iconTile.className = 'service-icon-tile';
            if (meta.iconBg) iconTile.style.background = meta.iconBg;
            iconTile.innerHTML = meta.icon;

            // Details
            const details = document.createElement('div');
            details.className = 'service-details';

            const title = document.createElement('div');
            title.className = 'service-title';
            title.textContent = meta.title;

            const metaRow = document.createElement('div');
            metaRow.className = 'service-meta-row';

            const subtitle = document.createElement('span');
            subtitle.className = 'service-subtitle';
            subtitle.textContent = meta.subtitle;
            metaRow.appendChild(subtitle);

            if (meta.port) {
              const portBadge = document.createElement('span');
              portBadge.className = 'service-port-badge';
              portBadge.textContent = meta.port;
              metaRow.appendChild(portBadge);
            }

            details.append(title, metaRow);

            // Status pill
            const pill = document.createElement('div');
            pill.className = 'status-pill';

            const dot = document.createElement('span');
            dot.className = 'status-dot';

            const statusText = document.createElement('span');
            statusText.textContent = STATUS_LABELS[step.status] || step.status;

            pill.append(dot, statusText);

            item.append(iconTile, details, pill);
            return item;
          }));

          if (status.error) {
            showError(status.error, status.configPath);
          } else {
            elements['app-name'].textContent = config.applicationName;
            elements.error.hidden = true;
          }
        } catch (_) {
          if (!stopped) showError('Unable to read desktop startup progress. Restart the application.');
        } finally {
          if (!stopped) setTimeout(poll, config.pollIntervalMs);
        }
      }

      window.__DETQEL_STARTUP_SHUTDOWN__ = () => {
        stopped = true;
        const tierBadge = document.querySelector('.tier-badge');
        if (tierBadge) {
          tierBadge.classList.add('stopping');
          const span = tierBadge.querySelector('span:last-child');
          if (span) span.textContent = 'Shutting Down';
        }
        elements.progress.classList.add('shutdown');
        elements.active.textContent = 'Stopping all background services...';
        elements.percent.textContent = '15%';
        elements.progress.style.width = '15%';
        elements.track.setAttribute('aria-valuenow', '15');
        elements.error.hidden = true;

        if (!elements.services.children.length) {
          elements.services.replaceChildren(...Object.entries(SERVICE_REGISTRY).map(([id, meta]) => {
            const item = document.createElement('li');
            item.className = 'service-card';
            item.dataset.status = 'stopping';

            const iconTile = document.createElement('div');
            iconTile.className = 'service-icon-tile';
            if (meta.iconBg) iconTile.style.background = meta.iconBg;
            iconTile.innerHTML = meta.icon;

            const details = document.createElement('div');
            details.className = 'service-details';

            const title = document.createElement('div');
            title.className = 'service-title';
            title.textContent = meta.title;

            const metaRow = document.createElement('div');
            metaRow.className = 'service-meta-row';
            const subtitle = document.createElement('span');
            subtitle.className = 'service-subtitle';
            subtitle.textContent = meta.subtitle;
            metaRow.appendChild(subtitle);
            if (meta.port) {
              const portBadge = document.createElement('span');
              portBadge.className = 'service-port-badge';
              portBadge.textContent = meta.port;
              metaRow.appendChild(portBadge);
            }
            details.append(title, metaRow);

            const pill = document.createElement('div');
            pill.className = 'status-pill';
            const dot = document.createElement('span');
            dot.className = 'status-dot';
            const statusText = document.createElement('span');
            statusText.textContent = 'Stopping';
            pill.append(dot, statusText);

            item.append(iconTile, details, pill);
            return item;
          }));
        } else {
          document.querySelectorAll('.service-card').forEach(card => {
            card.dataset.status = 'stopping';
            const pillText = card.querySelector('.status-pill span:last-child');
            if (pillText) pillText.textContent = 'Stopping';
          });
        }
      };

      window.__DETQEL_UPDATE_SHUTDOWN__ = (message, percent) => {
        if (message) elements.active.textContent = message;
        if (typeof percent === 'number') {
          elements.progress.style.width = `${percent}%`;
          elements.percent.textContent = `${percent}%`;
          elements.track.setAttribute('aria-valuenow', String(percent));
          if (percent >= 100) {
            document.querySelectorAll('.service-card').forEach(card => {
              card.dataset.status = 'stopped';
              const pillText = card.querySelector('.status-pill span:last-child');
              if (pillText) pillText.textContent = 'Stopped';
            });
          }
        }
      };

      void poll();
    })();
  </script>
</body>
</html>
